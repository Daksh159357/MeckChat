[package]
name = "meckchat_core"
version = "0.1.0"
edition = "2021"
authors = ["MeckChat Contributors"]
description = "Core networking, cryptography, WireGuard signaling, and P2P engine for MeckChat"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rumqttc = "0.24.0"
tokio = { version = "1.38.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x25519-dalek = { version = "1.2.0", features = ["static_secrets"] }
argon2 = "0.5.3"
sha2 = "0.10.8"
rand = "0.8.5"
base64 = "0.22.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
flutter_rust_bridge = "2.0.0"
hex = "0.4.3"
thiserror = "1.0"
tracing = "0.1"
boringtun = "0.6.0"

[dev-dependencies]
tempfile = "3.10.1"
