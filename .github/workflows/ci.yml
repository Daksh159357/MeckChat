name: MeckChat CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  flutter-ci:
    name: Flutter CI (Analyze, Test, Linux & Android Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter Unit Tests
        run: flutter test

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          test -d build/linux/x64/release/bundle
          tar -czf MeckChat-Linux.tar.gz -C build/linux/x64/release/bundle .
          test -s MeckChat-Linux.tar.gz

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify Android Artifact
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
