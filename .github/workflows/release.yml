name: MeckChat Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Flutter Linux Project & Build
        run: |
          cd apps/flutter
          flutter create --org com.meckchat --platforms=linux .
          rm -f test/widget_test.dart
          flutter pub get
          flutter build linux --release

      - name: Verify & Compress Linux Bundle
        run: |
          test -d apps/flutter/build/linux/x64/release/bundle
          tar -czvf MeckChat-Linux.tar.gz -C apps/flutter/build/linux/x64/release/bundle .
          test -s MeckChat-Linux.tar.gz
          ls -lh MeckChat-Linux.tar.gz

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meckchat-linux-archive
          path: MeckChat-Linux.tar.gz

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Flutter Android Project & Build
        run: |
          cd apps/flutter
          flutter create --org com.meckchat --platforms=android .
          rm -f test/widget_test.dart
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Verify & Rename Android APK
        run: |
          test -f apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          cp apps/flutter/build/app/outputs/flutter-apk/app-release.apk MeckChat-Android.apk
          test -s MeckChat-Android.apk
          ls -lh MeckChat-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meckchat-android-apk
          path: MeckChat-Android.apk

  create-github-release:
    name: Create GitHub Release & Upload Binaries
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true

      - name: Verify & Generate SHA256 Checksums
        run: |
          mkdir -p release-files
          find release-downloads -name "MeckChat-Linux.tar.gz" -exec cp {} release-files/ \;
          find release-downloads -name "MeckChat-Android.apk" -exec cp {} release-files/ \;
          
          test -s release-files/MeckChat-Linux.tar.gz
          test -s release-files/MeckChat-Android.apk
          
          cd release-files
          ls -lh
          sha256sum MeckChat-Android.apk MeckChat-Linux.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MeckChat Release ${{ github.ref_name }}
          files: |
            release-files/MeckChat-Android.apk
            release-files/MeckChat-Linux.tar.gz
            release-files/SHA256SUMS.txt
          draft: false
          prerelease: false
          body: |
            ## MeckChat Phase 1 Release ${{ github.ref_name }} — Real Linux ↔ Android Discovery

            ### Download Release Binaries:
            * 📱 **Android (APK)**: `MeckChat-Android.apk`
            * 🐧 **Linux (x64)**: `MeckChat-Linux.tar.gz` (Complete runnable release bundle)
            * 🔒 **SHA-256 Checksums**: `SHA256SUMS.txt`

            ### Phase 1 Features:
            * **HiveMQ TLS Discovery**: Automatic discovery over `broker.hivemq.com:8883`.
            * **Persistent Device Identity**: Unique UUID-backed identity per device.
            * **Self-Filtering & Heartbeat**: 30-second presence heartbeat with instant discovery response.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
